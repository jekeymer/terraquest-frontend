name: fetch-live-bundle

# Helper used during initial repo construction (2026-09-27): pulls the
# deployed bundle byte-for-byte from the verified live site
# https://microbes.biotexturas.org/ (upload verified 2026-09-27 08:04Z).
# sim.html, dj.html and battle.html exceed the API client's single-push size
# cap; battle_data.json and index.html are fetched to guarantee byte-exact
# parity with the deploy. Safe to delete once satisfied; re-run by pushing.

on: [push]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live files
        run: |
          set -e
          for f in index.html sim.html dj.html battle.html battle_data.json; do
            curl -fsSL "https://microbes.biotexturas.org/$f" -o "$f"
          done
          wc -c index.html sim.html dj.html battle.html battle_data.json
      - name: Commit fetched files
        run: |
          git config user.name "b1"
          git config user.email "b1@hellominds.ai"
          git add index.html sim.html dj.html battle.html battle_data.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Sync deployed bundle byte-for-byte from live microbes.biotexturas.org"
            git push
          fi
